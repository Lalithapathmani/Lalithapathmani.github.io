<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; display: flex; justify-content: center;
            align-items: center; padding: 20px;
        }
       .container {
            background: rgba(255, 255, 255, 0.95); border-radius: 20px;
            padding: 30px; max-width: 500px; width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
       .search-box { display: flex; gap: 10px; margin-bottom: 25px; }
        input {
            flex: 1; padding: 12px 15px; border: 2px solid #ddd;
            border-radius: 10px; font-size: 16px; outline: none;
        }
        input:focus { border-color: #667eea; }
        button {
            padding: 12px 25px; background: #667eea; color: white;
            border: none; border-radius: 10px; cursor: pointer;
            font-size: 16px; font-weight: 600;
        }
