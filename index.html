<!DOCTYPE html>
<html>
    <head>
        <title>Click Game Pro v3.0 - 10s Challenge</title>
        <style>
            body {
                font-family:Arial,sans-serif;
                text-align:center;
                background: #0d1117;
                color: #fff;
                padding: 20px;
                margin: 0;
            }
            .game-box {
                background: #161b22;
                padding: 30px;
                border-radius: 12px;
                max-width: 400px;
                margin: 20px auto;
                border: 1px solid #30363d;
            }
            h1 {color: #2ea043;margin:0 0 5px 0;}
            h3 {color: #8b949e; margin:0 0 20px 0; font-weight:normal;}
            #score { font-size: 72px; font-weight: bold; margin: 20px 0;}
            #timer { font-size: 24px; color: #f0883e; margin: 20px 0;}
            button {
                background: #238636;
                color: white;
                border: none;
                padding: 15px 30px;
                font-size: 20px;
                border-radius: 8px;
                cursor: pointer;
                margin: 5px;
                width: 80%;
            }
            button:disabled { background: #30363d; cursor: not-allowed; }
            #startBtn { background: #1f6feb;}
            #resetBtn { background: #da3633;}
            .stats { margin-top: 20px; color: #8b949e;}
            </style>
    </head>
    <body>
        <div class="game-box">
            <h1>Click Game Pro v3.0</h1>
            <h3>by Sandali Geethma - 10s Challenge</h3>

            <div id="timer">Time: 10s</div>
            <div id="score">0</div>

            <button id="clickBtn" disabled>CLICK ME!</button>
            <br>
            <button id="startBtn">START GAME</button>
            <button id="resetBtn">RESET</button>

            <div class="stats">
                <p>High Score: <span id="highScore">0</span></p>
            </div>

            <br>
            <a href="https://github.com/Lalithapathmani"target="_blank" style="display: inline-block; 10px 20px; background: #24292e; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px;">
                view My GitHub
            </a>
        </div>

        <script>
            let Score = 0;
            let timeLeft = 10;
            let timerId = null;
            let gameRunning = false;

            const scoreEl = document.getElementById('score');
            const timerEl = document.getElementById('timer');
            const highScoreEl = document.getElementById('highScore');
            const clickBtn = document.getElementById('clickBtn');
            const startBtn = document.getElementById('startBtn');
            const resetBtn = document.getElementById('resetBtn');

            //Sound effect
const popSound = new Audio('https://cdn.pixbay.com/download/audio/2022/03/15/audio_d1718ab41b.mp3');
            popSound.volume = 0.3;

            highScoreEl.textContent = localStorage.getItem('highScoreV3') || 0;

            function updateScore() {
                if (gameRunning) {
                    popSound.currentTime = 0;
                    popSound.play();
                    score++;
                    scoreEl.textContent = score;
                }
            }

            function startGame() {
                score = 0;
                timeLeft = 10;
                gameRunning = true;
                scoreEl.textContent = score;
                timerEl.textContent = `Time:${timeLeft}s`;
                startBtn.disabled = true;
                clickBtn.disabled = false;

                timerId = setInterval(() => {
                    timeLeft--;
                    timerEl.textContent = `Time: ${timeLeft}s`;
                    
                if (timeLeft <= 0) {
                    endGame();
                }
            },1000);
            }

            function endGame() {
                clearInterval(timerId);
                gameRunning = false;
                clickBtn.disabled = true;
                timerEl.textContent = "Game Over!";

                let currentHigh = localStorage.getItem('highScoreV3')|| 0;
                if (score > currentHigh) {
                    localStorage.setItem('highScoreV3',score);
                    highScoreEl.textContent = score;
                    alert('New High Score!🎉'+score+'clicks in 10s!');
                          } else {
                    alert(`Time's up! You scored ${score} clicks.`);
                }
            }

            function resetGame() {
                clearInterval(timerId);
                gameRunning = false;
                score = 0;
                timeLeft = 10;
                scoreEl.textContent = score;
                timerEl.textContent =`Time: ${timeLeft}s`;
                clickBtn.disabled = true;
                startBtn.disabled = false;
            }

            clickBtn.addEventListener('click',updateScore);
            startBtn.addEventListener('click',startGame);
            resetBtn.addEventListener('click',resetGame);
        </script>
    </body>
</html>                    
</html>
