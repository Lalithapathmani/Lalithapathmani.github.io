<!DOCTYPE html>
<html>
    <head>
        <title>Click Game Pro v2.0 - Sandali FINAL</title>
        <style>
            body {text-align:center;font-family:Arial;background: #1a1a1a;color:white;}
            h1{ color: #00ff88;}
            button { font-size:24px;padding:20px 40px;cursor:pointer;background:#00ff88; border: none;border-radius:10px;}
            #score { font-size:48px;margin:20px;}
            </style>
    </head>
    <body>
        <h1>Click Game Pro v2.0</h1>
        <p>by Sandali Geethma - Future Software Engineer</p>
        <div id="score">0</div>
        <button onclick="addScore()">CLICK ME!</button>
        <p>High Score: <span id="highscore>0</span></p>
                           <button onclick="resetGame()">Reset</button>
            <script>
                let score = 0;
                let highScore = localStorage.getItem('highScore') ||0;
                document.getElementById('highscore').innerText = highScore;
                function addScore() {

                score++;
                    document.getElementById('score').innerText = score;
                    if (score > highScore) {
                        highScore = score;
                        localStorage.setItem('highScore',highScore);
                        document.getElementById('highscore').innerText = highScore;
                    }
                }
                function resetGame() {

                score = 0;
                    document.getElementById('score').innerText = score;
                }
</script>
    </body>
</html>
